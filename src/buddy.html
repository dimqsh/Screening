<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'none'"
    />
    <title>Screening — Buddy</title>
    <link rel="stylesheet" href="buddy.css" />
  </head>
  <body>
    <svg class="icons" xmlns="http://www.w3.org/2000/svg">
      <symbol id="b-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="12" height="13" rx="2.5" />
        <path d="M16 8V5.5A2.5 2.5 0 0 0 13.5 3h-8A2.5 2.5 0 0 0 3 5.5v8A2.5 2.5 0 0 0 5.5 16H8" />
      </symbol>
      <symbol id="b-pin" viewBox="0 0 24 24">
        <path d="M9 4h6l-1 5 4 4H6l4-4-1-5Z" />
        <path d="M12 13v7" />
      </symbol>
      <symbol id="b-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M18 6 6 18" />
      </symbol>
      <symbol id="b-open" viewBox="0 0 24 24">
        <path d="M14 4h6v6M20 4l-8 8" />
        <path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4" />
      </symbol>
      <symbol id="b-spark" viewBox="0 0 24 24">
        <path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18" />
      </symbol>
      <symbol id="b-eye-off" viewBox="0 0 24 24">
        <path d="M3 3l18 18" />
        <path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3 3.8M6.6 6.6A17 17 0 0 0 2.5 12S6 19 12 19a9.6 9.6 0 0 0 4.4-1" />
        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
      </symbol>
    </svg>

    <div id="island" class="island" data-mode="setup">
      <i class="ear ear-left" aria-hidden="true"></i
      ><i class="ear ear-right" aria-hidden="true"></i>
      <div class="glow" aria-hidden="true"></div>
      <div class="body">
        <div class="bar">
          <div class="wing wing-left">
            <button id="orb" class="orb-button" type="button" aria-pressed="false">
              <span class="orb" aria-hidden="true"></span>
            </button>
            <span id="label" class="label" role="status"></span>
          </div>
          <div class="notch-gap" aria-hidden="true"></div>
          <div class="wing wing-right">
            <span id="wave" class="wave" aria-hidden="true"
              ><i></i><i></i><i></i><i></i><i></i
            ></span>
            <span id="timer" class="timer"></span>
            <span id="shield" class="shield" role="img"></span>
          </div>
        </div>

        <section id="panel" class="panel">
          <header class="panel-head">
            <span id="title" class="panel-title"></span>
            <span id="meta" class="panel-meta"></span>
            <div class="panel-tools">
              <button id="pin" class="tool" type="button" aria-pressed="false">
                <svg><use href="#b-pin" /></svg>
              </button>
              <button id="dismiss" class="tool" type="button">
                <svg><use href="#b-close" /></svg>
              </button>
            </div>
          </header>
          <p id="question" class="question"></p>
          <div id="shimmer" class="shimmer" aria-hidden="true">
            <i></i><i></i><i></i>
          </div>
          <div id="answer" class="reading"></div>
          <div id="heard" class="heard">
            <span id="heard-label" class="eyebrow"></span>
            <p id="heard-text"></p>
          </div>
          <p id="detail" class="detail"></p>
          <footer class="actions">
            <button id="answer-now" class="action primary" type="button">
              <svg><use href="#b-spark" /></svg><span id="answer-now-label"></span>
            </button>
            <button id="copy" class="action" type="button">
              <svg><use href="#b-copy" /></svg><span id="copy-label"></span>
            </button>
            <button id="open-app" class="action" type="button">
              <svg><use href="#b-open" /></svg><span id="open-label"></span>
            </button>
            <button id="hide-buddy" class="action quiet" type="button">
              <svg><use href="#b-eye-off" /></svg><span id="hide-label"></span>
            </button>
          </footer>
          <p id="keys" class="keys"></p>
        </section>
      </div>
    </div>

    <div id="test-view" class="capture-probe" hidden>
      <div class="probe"></div>
      <p>SYNTHETIC BUDDY TEST</p>
      <h1>Screening</h1>
      <p>Magenta marker = window captured</p>
    </div>

    <script src="i18n.js"></script>
    <script src="buddy-model.js"></script>
    <script src="buddy.js"></script>
  </body>
</html>

name: Build and upload macOS installer
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag and draft release
        required: true
permissions:
  contents: write
jobs:
  macos:
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/prepare-speech-test.cjs
      - name: Restore ONNX Runtime for Intel Macs
        if: matrix.arch == 'x64'
        id: ort
        uses: actions/cache@v4
        with:
          path: build/onnxruntime-darwin-x64
          key: onnxruntime-darwin-x64-${{ hashFiles('scripts/build-onnxruntime.cjs', 'package-lock.json') }}
      - name: Build ONNX Runtime for Intel Macs
        if: matrix.arch == 'x64' && steps.ort.outputs.cache-hit != 'true'
        run: node scripts/build-onnxruntime.cjs --build
      - name: Install ONNX Runtime for Intel Macs
        if: matrix.arch == 'x64'
        run: node scripts/build-onnxruntime.cjs --install
      - run: npm run ${{ matrix.arch == 'x64' && 'package:mac:x64' || 'package:mac' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify the DMG app and local Whisper
        run: |
          set -e
          dmg=$(find dist -maxdepth 1 -name "*mac-${{ matrix.arch }}.dmg" -print -quit)
          hdiutil verify "$dmg"
          mkdir -p build/dmg-check
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$PWD/build/dmg-check"
          trap 'hdiutil detach "$PWD/build/dmg-check" || true' EXIT
          codesign --verify --deep --strict "$PWD/build/dmg-check/Screening.app"
          export CAPTURE_LAB_ARTIFACTS="$PWD/validation/macos-ci"
          export CAPTURE_LAB_MODEL_CACHE="$PWD/build/model-cache"
          export CAPTURE_LAB_TEST_AUDIO="$PWD/build/jfk.f32"
          "$PWD/build/dmg-check/Screening.app/Contents/MacOS/Screening" --verify --interview-test --screening-test --compact-test > build/macos-verify.log 2>&1
          cat build/macos-verify.log
          test -f validation/macos-ci/verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-validation-${{ matrix.arch }}
          path: |
            validation/macos-ci/
            build/macos-verify.log
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          shasum -a 256 dist/*mac-${{ matrix.arch }}.dmg
          gh release upload "$RELEASE_TAG" dist/*mac-${{ matrix.arch }}.dmg --clobber

name: Build and upload macOS installers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag and draft release
        required: true
permissions:
  contents: write
jobs:
  macos:
    name: macos (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            machine: arm64
            runner: macos-15
            package: package:mac
          # GitHub's last Intel image; macos-13 was retired in December 2025.
          - arch: x64
            machine: x86_64
            runner: macos-15-intel
            package: package:mac:x64
    # Each DMG is tested on a Mac of its own architecture.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      ARCH: ${{ matrix.arch }}
      MACHINE: ${{ matrix.machine }}
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/prepare-speech-test.cjs
      - run: npm run ${{ matrix.package }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          SCREENING_SIGN_P12: ${{ secrets.SCREENING_SIGN_P12 }}
          SCREENING_SIGN_PASSWORD: ${{ secrets.SCREENING_SIGN_PASSWORD }}
      - name: Verify the DMG app and local Whisper
        run: |
          set -e
          dmg=$(find dist -maxdepth 1 -name "*mac-$ARCH.dmg" -print -quit)
          test -n "$dmg"
          hdiutil verify "$dmg"
          mkdir -p build/dmg-check
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$PWD/build/dmg-check"
          trap 'hdiutil detach "$PWD/build/dmg-check" || true' EXIT
          app="$PWD/build/dmg-check/Screening.app"
          codesign --verify --deep --strict "$app"
          # Another certificate would make every user allow access again.
          codesign -d -r- "$app" 2>&1 | grep -F 'certificate root = H"aeae2d13bc6111253bd6427dc550f91e6b2154f3"'
          unpacked="$app/Contents/Resources/app.asar.unpacked/node_modules"
          for binary in "$app/Contents/MacOS/Screening" "$app"/Contents/Resources/bin/* \
            "$app/Contents/Resources/codex/codex" \
            "$unpacked/onnxruntime-node/bin/napi-v6/darwin/$ARCH/onnxruntime_binding.node" \
            "$unpacked"/@img/sharp-darwin-$ARCH/lib/*.node; do
            lipo "$binary" -verify_arch "$MACHINE" || { echo "Not $MACHINE: $binary"; exit 1; }
          done
          # No other platform's onnxruntime or sharp binaries ride along.
          ort=$(cd "$unpacked/onnxruntime-node/bin/napi-v6" && echo */*)
          img=$(cd "$unpacked/@img" && echo *)
          [ "$ort" = "darwin/$ARCH" ] || { echo "Extra onnxruntime binaries: $ort"; exit 1; }
          [ "$img" = "sharp-darwin-$ARCH sharp-libvips-darwin-$ARCH" ] || { echo "Extra sharp binaries: $img"; exit 1; }
          export CAPTURE_LAB_ARTIFACTS="$PWD/validation/macos-ci"
          export CAPTURE_LAB_MODEL_CACHE="$PWD/build/model-cache"
          export CAPTURE_LAB_TEST_AUDIO="$PWD/build/jfk.f32"
          "$app/Contents/MacOS/Screening" --verify --interview-test --screening-test --compact-test > build/macos-verify.log 2>&1
          cat build/macos-verify.log
          test -f validation/macos-ci/verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-${{ matrix.arch }}-validation
          path: |
            validation/macos-ci/
            build/macos-verify.log
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          shasum -a 256 dist/*mac-$ARCH.dmg
          gh release upload "$RELEASE_TAG" dist/*mac-$ARCH.dmg --clobber

name: Build and upload macOS installer
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag and draft release
        required: true
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/prepare-speech-test.cjs
      - run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          SCREENING_SIGN_P12: ${{ secrets.SCREENING_SIGN_P12 }}
          SCREENING_SIGN_PASSWORD: ${{ secrets.SCREENING_SIGN_PASSWORD }}
      - name: Verify the DMG app and local Whisper
        run: |
          set -e
          dmg=$(find dist -maxdepth 1 -name '*mac-arm64.dmg' -print -quit)
          hdiutil verify "$dmg"
          mkdir -p build/dmg-check
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$PWD/build/dmg-check"
          trap 'hdiutil detach "$PWD/build/dmg-check" || true' EXIT
          codesign --verify --deep --strict "$PWD/build/dmg-check/Screening.app"
          # Another certificate would make every user allow access again.
          codesign -d -r- "$PWD/build/dmg-check/Screening.app" 2>&1 | grep -F 'certificate root = H"aeae2d13bc6111253bd6427dc550f91e6b2154f3"'
          export CAPTURE_LAB_ARTIFACTS="$PWD/validation/macos-ci"
          export CAPTURE_LAB_MODEL_CACHE="$PWD/build/model-cache"
          export CAPTURE_LAB_TEST_AUDIO="$PWD/build/jfk.f32"
          "$PWD/build/dmg-check/Screening.app/Contents/MacOS/Screening" --verify --interview-test --screening-test --compact-test > build/macos-verify.log 2>&1
          cat build/macos-verify.log
          test -f validation/macos-ci/verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-validation
          path: |
            validation/macos-ci/
            build/macos-verify.log
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          shasum -a 256 dist/*mac-arm64.dmg
          gh release upload "$RELEASE_TAG" dist/*mac-arm64.dmg --clobber

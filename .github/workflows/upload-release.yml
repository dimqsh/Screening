name: Upload verified installer
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build installers run ID
        required: true
      tag:
        description: Existing draft release tag
        required: true
permissions:
  actions: read
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Upload the tested artifact to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          conclusion=$(gh run view "$RUN_ID" --json conclusion --jq .conclusion)
          [[ "$conclusion" = success ]] || { echo 'Build has not passed'; exit 1; }
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          [[ "$draft" = true ]] || { echo 'Release must remain a draft'; exit 1; }
          gh run download "$RUN_ID" -n Windows-installer -D installer
          sha256sum installer/*.exe
          gh release upload "$RELEASE_TAG" installer/*.exe --clobber
